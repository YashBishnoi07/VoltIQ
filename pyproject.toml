[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voltiq"
version = "0.1.0"
description = "EV Charging Demand Forecasting & Station Utilization Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "shap>=0.45",
    "optuna>=3.6",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.23",
    "joblib>=1.4",
    "holidays>=0.54",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "cachetools>=5.5",
    "pyarrow>=16.0",
    "fastparquet>=2024.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.5.7",
    "pre-commit==3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["voltiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/voltiq --cov=api --cov-report=term-missing --cov-fail-under=70"
